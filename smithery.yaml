# Smithery configuration for SEFAZ MT: Primeiro Emplacamento
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_sefaz_mt_primeiro_emplacamento

name: sefaz_mt_primeiro_emplacamento-mcp
displayName: "SEFAZ MT: Primeiro Emplacamento"
description: >
  SEFAZ MT: Primeiro Emplacamento, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/sefaz_mt_primeiro_emplacamento-mcp
repository: https://github.com/mcp-dir/sefaz_mt_primeiro_emplacamento-mcp

tags:
  - sefaz_mt_primeiro_emplacamento
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_sefaz_mt_primeiro_emplacamento

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_sefaz_mt_primeiro_emplacamento/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
